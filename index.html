
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>te amo mi amoreeee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <h1 class="hero__title">
      Minha Princesa<br>
      <em>Escrevendo um pouco mais sobre a pessoa incrivel que você é e tudo o que faz por mim</em><br>
      Eu te amo muito
    </h1>

    <p class="hero__subtitle">clique em cada coração para abrir</p>

    <div class="hero__sparkles">
      <div class="pixel-star"></div>
      <div class="pixel-star"></div>
      <div class="pixel-star"></div>
    </div>
  </header>

  <main class="hearts-grid" id="hearts">
    <!-- Os 4 corações são criados automaticamente pelo script -->
  </main>

  <!-- Modal da carta -->
  <div class="overlay" id="overlay">
    <div
      class="letter-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="letterTitle"
    >
      <button
        class="letter-card__close"
        id="closeBtn"
        aria-label="Fechar carta"
      >
        X
      </button>

      <h2 class="letter-card__title" id="letterTitle">
        Título
      </h2>

      <div class="letter-card__photo-frame">
        <img
          class="letter-card__photo"
          id="letterPhoto"
          src=""
          alt="Foto da carta"
        >
      </div>

      <p class="letter-card__text" id="letterText"></p>

      <div class="letter-card__footer">
        <div class="pixel-star"></div>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    pra melhor namorada do mundo, mesmo sem ser oficial
  </footer>

  <script>
    /* =========================================================
       ✏️ TEXTOS E FOTOS DOS CORAÇÕES
       As fotos devem ficar dentro da pasta "img".
       ========================================================= */

    const CORACOES = [
      {
        titulo: "Quem a Luísa é pra mim?",
        texto: `Desde que você chegou não tem um dia em que eu não acorde com um sorriso no rosto, eu falo que existe um Pedro antes e um Pedro depois de você, a mudança é nitida.

Acho que se eu fosse definir quem você é pra mim em uma palavra eu falaria Tudo, meus dias são coloridos com você neles, minhas semanas massivas e cansativas se tornaram leves, pois a garota mais incrivel do mundo é a parte mais importante delas.

Você é o sol loiro (agora moreno kkkk) que ilumina minha vida, você me coloca pra cima, você faz de tudo pra tirar um sorriso do meu rosto, você é a garota dos olhos de Jesus e é tão cheia do Amor dEle que esse amor inundou a minha vida também, e é lindo isso!

Eu sou apaixonado em cada detalher seu, cada detalhe da sua personalidade, cada detalhe presente em você, eu poderia citar um zilhão de coisas, como por exemplo, o jeito que seus olhos brilham quando me vê, eu sou apaixonado neles, pois toda vez que olho pra eles, eu vejo o brilho do espirito santo.

Você é luz, você é o amor da minha vida, meu amor por você é como as Estações, mudam, se renovam, se adptam, mas nunca deixam de existir.

Você é incrivel meu amor, nunca se esqueça disso!`,
        foto: "coracao1.jpg"
      },

      {
        titulo: "Clique e tenha uma surpresa",
        texto: `A única vez que chorei por medo de perder alguém foi por você, eu olhava para aquela sinuca de bico que o nosso relacionamento estava e só pensava que se você quisesse abandonar o barco, você tava totalmente no seu direito, pois você não precisava passar por aquilo, por um menino que até então era inseguro, não sabia confiar e achava que a qualquer dia poderia aparecer outro alguém 100x melhor que ele, mas você escolheu ficar, escolheu me dar a mão e enfrentar tudo aquilo comigo, foi ali que eu percebi que você é a mulher que Deus preparou pra mim, o amor da minha vida!

Em toda a história jamais existira palavra pra definir minha gratidão a Deus por colocar você na minha vida, você chegou do nada, da forma mais aleatória possível, me deu um pé na bunda e depois se tornou tudo pra mim, meu amor por ti minha princesa é a coisa mais linda que eu já senti, ele é Inefável que é a unica palavra que chegou perto de definir meu amor por ti, Inefável é algo extraordinário, sublime ou intenso ao ponto de não poder ser expresso ou descrito com palavras.

Obrigado por tudo meu bem, você transformou minha vida, hoje eu sou feliz, ando de cabeça erguida e sigo ansioso pra passar cada momento da minha vida com você, eu te vivo!`,
        foto: "coracao2.jpg"
      },

      {
        titulo: "Clique e tenha uma surpresa",
        texto: `EU TE AMO, E ESSA É SÓ MAIS UMA FORMA QUE EU BUSCO PRA ALEGRAR SEU DIA, MESMO ESTANDO LONGE EU BUSCO ESTAR PERTO.

EU TE AMO MIL MILHÕES TRILHÕES ZILHÕES!!!!!!!!!!!!!!`,
        foto: "coracao3.jpg"
      },

      {
        titulo: "6 meses com você",
        texto: `Amor, nesses 6 meses com você uma nova versão de mim nasceu, eu aprendi inumeras coisas, como por exemplo, o amor, antes de você o amor pra mim era algo desconhecido, eu nunca tinha sido amado verdadeiramente antes, mas com você e Jesus no centro do nosso relacionamento, eu aprendi que:

"O amor é paciente, o amor é bondoso. Não inveja, não se vangloria, não se orgulha. Não maltrata, não procura os próprios interesses, não se ira, não guarda rancor. O amor não se alegra com a injustiça, mas se alegra com a verdade. Tudo sofre, tudo crê, tudo espera, tudo suporta."

(1Coríntios 13:4-7)

Você é a personificação viva desse versiculo!

Você me ensinou a enxergar uma versão minha que eu mesmo nunca tinha visto, você enxergou naquele "mendiguinho cabeludinho" como você chama kkkk, um menino lindo, que apenas não enxergava isso, o Pedro da Luísa, é muito melhor que o de antes, ele possui a mesma essencia, porem sabe se amar e ser amado pela mulher mais linda que jesus já fez, a mulher de provérbios 31, pela pessoa mais esforçada, mais dedicada, mais incrivel que eu conheço.

São 155 dias ao seu lado, 155 dias que eu aprendo todos os dias a ser um homem melhor por você, 155 dias de uma vida toda ao seu lado (pq você vai passar a vida comigo, não tem mais escolha).

São 155 dias que eu te amo mais e mais a cada dia que passa, se é que isso é possivel, mas eu sei que é porque eu me apaixono mais todos os dias pelo mesmo sorriso, mesmas gracinhas (que por mais que eu leve a sério a maioria delas, eu amo) mesmo caqbelo, seja ele preso(GOAT), solto, liso, ou com ondinhas que eu amo tambem, me apaixono todos os dias pela pessoa que mais me aproxima de Jesus, pela pessoa em que o espirito santo brilha nela todos os dias!!!!!!

MEU AMOR VOCÊ É INCRIVEL, E SE TE FALARAM ALGO QUE É DIFERENTE DISSO É MENTIRA! VOCÊ É INCRIVELMENTE INCRIVEL!

EU TE VIVO, EU TE AMO, EU TE RESPEITO, EU TE ADMIRO E AMO FAZER PARTE DA SUA VIDA.

Com amor: Pedro ❤️`,
        foto: "coracao4.jpg"
      }
    ];

    /* =========================================================
       ELEMENTOS DA PÁGINA
       ========================================================= */

    const heartsContainer = document.getElementById("hearts");
    const overlay = document.getElementById("overlay");
    const letterTitle = document.getElementById("letterTitle");
    const letterText = document.getElementById("letterText");
    const letterPhoto = document.getElementById("letterPhoto");
    const closeBtn = document.getElementById("closeBtn");

    // Grade de pixels do coração (11 colunas x 10 linhas)
    const HEART_PIXELS = [
      [2, 0], [3, 0], [7, 0], [8, 0],

      [1, 1], [2, 1], [3, 1], [4, 1],
      [6, 1], [7, 1], [8, 1], [9, 1],

      [0, 2], [1, 2], [2, 2], [3, 2], [4, 2],
      [5, 2], [6, 2], [7, 2], [8, 2], [9, 2], [10, 2],

      [0, 3], [1, 3], [2, 3], [3, 3], [4, 3],
      [5, 3], [6, 3], [7, 3], [8, 3], [9, 3], [10, 3],

      [0, 4], [1, 4], [2, 4], [3, 4], [4, 4],
      [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4],

      [1, 5], [2, 5], [3, 5], [4, 5], [5, 5],
      [6, 5], [7, 5], [8, 5], [9, 5],

      [2, 6], [3, 6], [4, 6], [5, 6],
      [6, 6], [7, 6], [8, 6],

      [3, 7], [4, 7], [5, 7], [6, 7], [7, 7],

      [4, 8], [5, 8], [6, 8],

      [5, 9]
    ];

    // Cria o coração em pixel art usando SVG
    function criarHeartSVG() {
      const ns = "http://www.w3.org/2000/svg";

      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 11 10");
      svg.setAttribute("aria-hidden", "true");

      HEART_PIXELS.forEach(([x, y]) => {
        const rect = document.createElementNS(ns, "rect");

        rect.setAttribute("class", "heart-pixel");
        rect.setAttribute("x", x);
        rect.setAttribute("y", y);
        rect.setAttribute("width", 1);
        rect.setAttribute("height", 1);
        rect.setAttribute("fill", "#ff2d6b");

        svg.appendChild(rect);
      });

      return svg;
    }

    // Cria todos os corações automaticamente
    CORACOES.forEach((item, i) => {
      const card = document.createElement("div");
      card.className = "heart-card";
      card.id = "card-" + i;

      const btn = document.createElement("button");
      btn.className = "heart-btn";
      btn.id = "heart-" + i;
      btn.type = "button";
      btn.setAttribute("aria-label", "Abrir " + item.titulo);

      const wrap = document.createElement("div");
      wrap.className = "heart-wrap";

      wrap.appendChild(criarHeartSVG());

      const label = document.createElement("span");
      label.className = "heart-wrap__label";
      label.textContent = item.titulo;

      wrap.appendChild(label);
      btn.appendChild(wrap);
      card.appendChild(btn);
      heartsContainer.appendChild(card);

      btn.addEventListener("click", () => {
        card.classList.add("is-opened");
        abrirCarta(i);
      });
    });

    // Abre a carta selecionada
    function abrirCarta(i) {
      const item = CORACOES[i];

      letterTitle.textContent = item.titulo;
      letterText.textContent = item.texto;
      letterPhoto.src = "img/" + item.foto;
      letterPhoto.alt = item.titulo;

      overlay.classList.add("is-visible");
      closeBtn.focus();
    }

    // Fecha a carta
    function fecharCarta() {
      overlay.classList.remove("is-visible");
    }

    closeBtn.addEventListener("click", fecharCarta);

    // Fecha ao clicar fora da carta
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        fecharCarta();
      }
    });

    // Fecha ao pressionar a tecla ESC
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        fecharCarta();
      }
    });
  </script>

</body>
</html>
