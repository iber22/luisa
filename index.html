
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Princesa ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hero">
    <h1 class="hero__title">
      Minha Princesa<br>
      <em>
        Escrevendo um pouco mais sobre a pessoa incrível que você é
        e tudo o que faz por mim
      </em><br>
      Eu te amo muito
    </h1>

    <p class="hero__subtitle">
      Clique em cada coração para abrir
    </p>

    <div class="hero__sparkles">
      <div class="pixel-star"></div>
      <div class="pixel-star"></div>
      <div class="pixel-star"></div>
    </div>
  </header>

  <main id="hearts" class="hearts-container"></main>

  <div id="letterModal" class="modal-overlay" aria-hidden="true">
    <div class="letter-modal" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
      <button
        id="closeModal"
        class="modal-close"
        type="button"
        aria-label="Fechar carta"
      >
        ×
      </button>

      <h2 id="letterTitle"></h2>

      <img
        id="letterPhoto"
        src=""
        alt="Foto especial"
        class="letter-photo"
      >

      <div id="letterText" class="letter-text"></div>
    </div>
  </div>

  <footer class="footer">
    Pra melhor namorada do mundo, mesmo sem ser oficial ❤️
  </footer>

  <script>
    const CORACOES = [
      {
        titulo: "O começo de tudo ❤️",
        foto: "coracao1.jpg",
        texto: `Luísa,

        Desde que você chegou, tudo ficou mais bonito. Até os dias difíceis parecem mais leves quando tenho você comigo.

        Obrigado por ser meu porto seguro, meu sorriso favorito e uma das maiores bênçãos que Jesus colocou na minha vida.

        Eu te amo muito! ❤️`
      },

      {
        titulo: "Tudo o que você mudou em mim 💗",
        foto: "coracao2.jpg",
        texto: `Amor,

        Você mudou a minha forma de enxergar a vida, o amor e até a mim mesmo.

        Com você, aprendi que amar também é cuidar, ouvir, respeitar, ter paciência e escolher a mesma pessoa todos os dias.

        Obrigado por me ensinar tanto e por me mostrar que o amor pode ser leve, verdadeiro e cheio de Deus.

        Eu sou muito feliz por ter você. ❤️`
      },

      {
        titulo: "Sobre você ser tão incrível 💕",
        foto: "coracao3.jpg",
        texto: `Minha princesa,

        Às vezes, eu fico tentando encontrar palavras que sejam capazes de explicar o quanto você é incrível, mas parece que nenhuma é suficiente.

        Você é linda por fora, mas é ainda mais bonita por dentro. Seu coração, sua dedicação, sua força, seu jeito de cuidar e sua forma de amar fazem de você alguém completamente especial.

        Eu admiro cada detalhe seu e agradeço a Deus por poder fazer parte da sua vida.

        Você é uma das minhas maiores alegrias. ❤️`
      },

      {
        titulo: "6 meses com você 💖",
        foto: "coracao4.jpg",
        texto: `Amor, nesses 6 meses com você, uma nova versão de mim nasceu. Eu aprendi inúmeras coisas, como, por exemplo, o amor.

        Antes de você, o amor, para mim, era algo desconhecido. Eu nunca tinha sido amado verdadeiramente antes, mas, com você e Jesus no centro do nosso relacionamento, eu aprendi que:

        "O amor é paciente, o amor é bondoso. Não inveja, não se vangloria, não se orgulha. Não maltrata, não procura os próprios interesses, não se ira, não guarda rancor. O amor não se alegra com a injustiça, mas se alegra com a verdade. Tudo sofre, tudo crê, tudo espera, tudo suporta."

        1 Coríntios 13:4-7

        Você é a personificação viva desse versículo!

        Você me ensinou a enxergar uma versão minha que eu mesmo nunca tinha visto. Você enxergou, naquele "mendiguinho cabeludinho", como você chama kkkkk, um menino lindo que apenas não enxergava isso.

        Quem seria o Pedro sem a Luísa, né? Você mudou a rota da minha vida — para melhor, óbvio. Você chegou do nada e, do nada, eu joguei meu coração na mesa. Falei tudo o que estava me machucando e, mesmo sem precisar, mesmo sem ser próxima, mesmo "me odiando", como você fala, você me tirou do lugar em que eu mais me sentia preso. Depois, tudo foi acontecendo e, hoje, não existe mais possibilidade de futuro sem você.

        O Pedro da Luísa é muito melhor que o de antes. Ele possui a mesma essência, porém sabe se amar e ser amado pela mulher mais linda que Jesus já fez: a mulher de Provérbios 31, a pessoa mais esforçada, mais dedicada e mais incrível que eu conheço.

        São 155 dias ao seu lado. São 155 dias em que eu aprendo, todos os dias, a ser um homem melhor por você. São 155 dias de uma vida inteira ao seu lado — porque você vai passar a vida comigo, não tem mais escolha.

        São 155 dias em que eu te amo mais e mais a cada dia que passa, se é que isso é possível. Mas eu sei que é, porque me apaixono mais todos os dias pelo mesmo sorriso, pelas mesmas gracinhas — que, por mais que eu leve a sério a maioria delas, eu amo — e pelo mesmo cabelo, seja ele preso (GOAT), solto, liso ou com ondinhas, que eu amo também.

        Eu me apaixono todos os dias pela pessoa que mais me aproxima de Jesus, pela pessoa em quem o Espírito Santo brilha todos os dias!!!!!!

        A palavra "felicidade" tem um significado, mas, nesses 6 meses, você ressignificou essa palavra. A felicidade agora tem os olhos, o sorriso e o cabelo mais lindos. Eu fico imaginando, sabe? Cada detalhe seu é incrível. Você é uma das criações mais bonitas de Deus. Eu acho que Ele demorou 3 dias para criar cada fio do seu cabelo e cada pequena sardinha do seu rosto. Eu falo isso porque você é rica em detalhes, e eu tenho o prazer de conhecer cada um deles!

        MEU AMOR, VOCÊ É INCRÍVEL, E, SE TE FALARAM ALGO QUE É DIFERENTE DISSO, É MENTIRA!

        VOCÊ É INCRIVELMENTE INCRÍVEL!

        EU TE VIVO, EU TE AMO, EU TE RESPEITO, EU TE ADMIRO E AMO FAZER PARTE DA SUA VIDA.

        Com amor,

        Pedro ❤️`
      }
    ];

    const HEART_PIXELS = [
      [2, 0], [3, 0], [6, 0], [7, 0],
      [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1],
      [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [7, 2], [8, 2], [9, 2],
      [0, 3], [1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3],
      [1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [8, 4],
      [2, 5], [3, 5], [4, 5], [5, 5], [6, 5], [7, 5],
      [3, 6], [4, 6], [5, 6], [6, 6],
      [4, 7], [5, 7]
    ];

    const heartsContainer = document.getElementById("hearts");
    const letterModal = document.getElementById("letterModal");
    const letterTitle = document.getElementById("letterTitle");
    const letterPhoto = document.getElementById("letterPhoto");
    const letterText = document.getElementById("letterText");
    const closeModalButton = document.getElementById("closeModal");

    function criarHeartSVG() {
      const svgNS = "http://www.w3.org/2000/svg";

      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 10 8");
      svg.setAttribute("class", "pixel-heart");
      svg.setAttribute("aria-hidden", "true");

      HEART_PIXELS.forEach(([x, y]) => {
        const rect = document.createElementNS(svgNS, "rect");

        rect.setAttribute("x", x);
        rect.setAttribute("y", y);
        rect.setAttribute("width", "1");
        rect.setAttribute("height", "1");

        svg.appendChild(rect);
      });

      return svg;
    }

    function criarCoracoes() {
      CORACOES.forEach((item, index) => {
        const heartCard = document.createElement("button");

        heartCard.type = "button";
        heartCard.className = "heart-card";
        heartCard.setAttribute(
          "aria-label",
          `Abrir carta: ${item.titulo}`
        );

        const heartWrapper = document.createElement("div");
        heartWrapper.className = "heart-wrapper";

        const heartNumber = document.createElement("span");
        heartNumber.className = "heart-number";
        heartNumber.textContent = index + 1;

        const heartTitle = document.createElement("h2");
        heartTitle.className = "heart-title";
        heartTitle.textContent = item.titulo;

        heartWrapper.appendChild(criarHeartSVG());
        heartWrapper.appendChild(heartNumber);

        heartCard.appendChild(heartWrapper);
        heartCard.appendChild(heartTitle);

        heartCard.addEventListener("click", () => {
          abrirCarta(item);
        });

        heartsContainer.appendChild(heartCard);
      });
    }

    function abrirCarta(item) {
      letterTitle.textContent = item.titulo;
      letterPhoto.src = item.foto;
      letterPhoto.alt = `Foto da carta: ${item.titulo}`;
      letterText.textContent = item.texto;

      letterModal.classList.add("is-open");
      letterModal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");

      closeModalButton.focus();
    }

    function fecharCarta() {
      letterModal.classList.remove("is-open");
      letterModal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
    }

    closeModalButton.addEventListener("click", fecharCarta);

    letterModal.addEventListener("click", (event) => {
      if (event.target === letterModal) {
        fecharCarta();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        fecharCarta();
      }
    });

    criarCoracoes();
  </script>
</body>
</html>
